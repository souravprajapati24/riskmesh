spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5435/notification_db
    username: riskmesh
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8084

management:
  server:
    port: 8094
  endpoints:
    web:
      exposure:
        include: health,info