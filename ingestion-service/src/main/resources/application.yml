spring:
  application:
    name: ingestion-service
  datasource:
    url: jdbc:postgresql://localhost:5436/ingestion_db
    username: riskmesh
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

management:
  server:
    port: 8091
  endpoints:
    web:
      exposure:
        include: health,info