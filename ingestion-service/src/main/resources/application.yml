spring:
  application:
    name: ingestion-service
  datasource:
    url: ${INGESTION_DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      ack: all
      retries: 3
      compression-type: lz4
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retry.backoff.ms: 1000
        delivery.timeout.ms: 30000
        max.block.ms: 5000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
  task:
    scheduling:
      pool:
        size: 4


riskmesh:
  security:
    hmac:
      shared-secret: ${HMAC_SHARED_SECRET}
    rate-limit:
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
      per-merchant-limit: ${RATE_LIMIT_PER_MERCHANT:1000}
      global-limit: ${RATE_LIMIT_GLOBAL:50000}
      ip-violation-threshold: ${IP_VIOLATION_THRESHOLD:100}
  kafka:
    enabled: true
    topics:
      replication-factor: 1
      min-insync-replicas: 1
  gateway:
    base-url: ${GATEWAY_BASE_URL:http://localhost:9099}
    hold-path: /api/v1/holds
    connect-timeout: 2s
    read-timeout: 5s
  saga:
    stalled-threshold: 5m
  outbox:
    escalation-after: 1h


server:
  port: 8081

management:
  server:
    port: 8091
  endpoints:
    web:
      exposure:
        include: health,info