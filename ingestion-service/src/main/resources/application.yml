spring:
  application:
    name: ingestion-service
  datasource:
    url: ${INGESTION_DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

riskmesh:
  security:
    hmac:
      shared-secret: ${HMAC_SHARED_SECRET}
    rate-limit:
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
      per-merchant-limit: ${RATE_LIMIT_PER_MERCHANT:1000}
      global-limit: ${RATE_LIMIT_GLOBAL:50000}
      ip-violation-threshold: ${IP_VIOLATION_THRESHOLD:100}


server:
  port: 8081

management:
  server:
    port: 8091
  endpoints:
    web:
      exposure:
        include: health,info