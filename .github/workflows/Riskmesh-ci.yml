name: riskmesh-ci

on:
  push:
  pull_request:

jobs:
  lint-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkstyle
        run: ./mvnw -B -q checkstyle:check

      - name: Spotless (formatting) check
        run: ./mvnw -B -q spotless:check